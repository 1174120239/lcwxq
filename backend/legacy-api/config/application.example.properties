# 服务端口
server.port=8081

# slf4j配置输出mybatis-dao相关的操作为DEBUG级别, 数据库日志会打印到debug文件中
logging.level.com.StarFreeApi.dao=INFO
logging.config=classpath:logback-spring.xml
logging.file=/var/log/lcxqy/starfree-legacy.log

# mybaits配置文件
mybatis.mapper-locations = classpath:mapper/*Mapper.xml
mybatis.type-aliases-package = com.StarFreeApi.entity

# mysql配置
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/lcxqy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=CHANGE_ME
spring.datasource.password=CHANGE_ME
mybatis.configuration.variables.prefix=starfree
# 数据表前缀，默认为starfree，当同一个服务器运行多个API时，则需要设置不同的前缀，防止数据库混淆。

# redis配置
spring.session.store-type=redis
spring.redis.host=127.0.0.1
spring.redis.password=
spring.redis.port=6379
# 连接池最大连接数（使用负值表示没有限制）
spring.redis.jedis.pool.max-active=20
# 连接池最大阻塞等待时间（使用负值表示没有限制）
spring.redis.jedis.pool.max-wait=-1
# 连接池中的最大空闲连接
spring.redis.jedis.pool.max-idle=10
# 连接池中的最小空闲连接
spring.redis.jedis.pool.min-idle=0
# 连接超时时间（毫秒）
spring.redis.timeout=3000

# 邮件发送配置
#POP3服务器: pop.qq.com
#SMTP服务器: smtp.qq.com
#IMAP服务器: imap.qq.com
spring.mail.host=smtp.qq.com
spring.mail.username=CHANGE_ME
#spring.mail.from不支持中文，需要中文，看mail.properties
spring.mail.password=CHANGE_ME
#465或者994
spring.mail.properties.mail.smtp.port: 465
spring.mail.properties.mail.smtp.ssl.enable: true
spring.mail.default-encoding=UTF-8


# 网站配置
# key为密钥，用于访问可视化配置中心,usertime为旧 API 用户登录状态过期时间，以秒为单位
# contentCache,contentInfoCache,CommentCache,userCache分别是文章列表，文章信息，评论列表，用户列表的缓存时间，单位是s
webinfo.key=CHANGE_ME_TO_A_LONG_RANDOM_VALUE
webinfo.usertime=7776000
webinfo.contentCache=6
webinfo.contentInfoCache=60
webinfo.CommentCache=20
webinfo.userCache=10
# 数据前缀，默认不需要修改，当同一个服务器运行多个API接口的时候，则需要设置不同的前缀，防止redis数据混淆。
web.prefix=starfree

# 支付宝当面付
gateway_url=https://openapi.alipaydev.com/gateway.do

#xss拦截白名单
mica.xss.allow-tags = p, audio, video
mica.xss.allow-attributes = src, controls, controlslist, id, width, height, webkit-playsinline, playsinline, x5-playsinline


#文件上传限制，单文件和总文件
spring.servlet.multipart.enabled: true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB

# 允许上传的文件格式，用逗号分隔
upload.allowed-extensions=.jpg,.jpeg,.png,.gif,.bmp,.webp,.mp4,.avi,.mov,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.pdf,.mp3,.wav,.ogg
