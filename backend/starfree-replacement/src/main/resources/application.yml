server:
  port: ${APP_PORT:8082}
  error:
    include-message: always

spring:
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 72MB
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:lcxqy_dev}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:lcxqy_dev}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 10000
  mail:
    host: ${SPRING_MAIL_HOST:smtp.qq.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    from: ${SPRING_MAIL_FROM:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT:10000}
      mail.smtp.timeout: ${SPRING_MAIL_READ_TIMEOUT:15000}
      mail.smtp.writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:15000}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2s
  jackson:
    default-property-inclusion: non_null

legacy:
  api:
    base-url: ${LEGACY_API_BASE_URL:https://api.lcxqy.cn}
  redis:
    enabled: ${LEGACY_REDIS_ENABLED:false}
    prefix: ${LEGACY_REDIS_PREFIX:starfree}
    session-ttl: ${LEGACY_REDIS_SESSION_TTL:86400}

# UniPush is opt-in. Keep credentials outside the repository and enable it only in the
# production runtime environment after the UniApp app id/client id pairing is verified.
unipush:
  enabled: ${UNIPUSH_ENABLED:false}
  # v1 = UniPush 1.0 (GeTui REST v1, auth_sign + push_single), v2 = GeTui REST v2.
  # This app is packaged with UniPush 1.0, so production must set UNIPUSH_PROTOCOL=v1.
  protocol: ${UNIPUSH_PROTOCOL:v2}
  app-id: ${UNIPUSH_APP_ID:}
  app-key: ${UNIPUSH_APP_KEY:}
  app-secret: ${UNIPUSH_APP_SECRET:}
  api-base: ${UNIPUSH_API_BASE:https://restapi.getui.com}

# Email notifications for dynamic comments/likes are opt-in and reuse Spring Mail
# (spring.mail.host/username/password from the server runtime configuration).
notification:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:true}

verification:
  email:
    enabled: ${VERIFICATION_EMAIL_ENABLED:true}
    max-concurrent: ${VERIFICATION_EMAIL_MAX_CONCURRENT:2}
