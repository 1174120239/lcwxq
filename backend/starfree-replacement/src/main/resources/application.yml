server:
  port: ${APP_PORT:8082}
  error:
    include-message: always

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:lcxqy_dev}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:lcxqy_dev}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 10000
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2s
  jackson:
    default-property-inclusion: non_null

legacy:
  api:
    base-url: ${LEGACY_API_BASE_URL:https://api.lcxqy.cn}
  redis:
    enabled: ${LEGACY_REDIS_ENABLED:false}
    prefix: ${LEGACY_REDIS_PREFIX:starfree}
    session-ttl: ${LEGACY_REDIS_SESSION_TTL:86400}

# UniPush is opt-in. Keep credentials outside the repository and enable it only in the
# production runtime environment after the UniApp app id/client id pairing is verified.
unipush:
  enabled: ${UNIPUSH_ENABLED:false}
  # v1 = UniPush 1.0 (GeTui REST v1, auth_sign + push_single), v2 = GeTui REST v2.
  # This app is packaged with UniPush 1.0, so production must set UNIPUSH_PROTOCOL=v1.
  protocol: ${UNIPUSH_PROTOCOL:v2}
  app-id: ${UNIPUSH_APP_ID:}
  app-key: ${UNIPUSH_APP_KEY:}
  app-secret: ${UNIPUSH_APP_SECRET:}
  api-base: ${UNIPUSH_API_BASE:https://restapi.getui.com}
