# Exact locations take precedence over the existing legacy catch-all proxy.
# Requests carrying a token stay on the legacy API until Redis sessions are bridged.
location = /SFreeAds/adsConfig {
    proxy_pass http://127.0.0.1:18082;
    add_header X-Starfree-Backend replacement-public-read always;
    proxy_connect_timeout 10;
    proxy_read_timeout 200;
    proxy_send_timeout 200;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
}

location = /SFreeAds/adsList {
    set $starfree_public_read http://127.0.0.1:18082;
    set $starfree_backend replacement-public-read;
    if ($arg_token != "") {
        set $starfree_public_read http://127.0.0.1:8081;
        set $starfree_backend legacy-token;
    }
    proxy_pass $starfree_public_read;
    add_header X-Starfree-Backend $starfree_backend always;
    proxy_connect_timeout 10;
    proxy_read_timeout 200;
    proxy_send_timeout 200;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
}

