# Adapt this example to the server's certificate paths and PHP-FPM version.
# On aaPanel, the existing `include enable-php-72.conf;` is usually the safest
# way to keep the panel-managed PHP-FPM socket and fastcgi parameters.
server {
    listen 80;
    server_name admin.example.com;
    root /www/wwwroot/admin.lcxqy.cn;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # This regex must appear before the generic PHP location.
    location ~ ^/(?:\.env|\.git|\.svn|\.user\.ini|Config_DB.*\.php|.*\.backup-|README\.md|LICENSE\.md) {
        return 404;
    }

    location ~ \.php$ {
        include enable-php-72.conf;
    }

    location ~ /\.well-known {
        allow all;
    }
}
