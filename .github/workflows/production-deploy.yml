name: Production deploy

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy
        required: true
        type: choice
        options:
          - replacement-backend
          - legacy-api
          - admin
          - all
      ref:
        description: Commit, tag, or branch to validate
        required: true
        default: main
        type: string
      dry_run:
        description: Build and validate only; do not connect to the server
        required: true
        default: true
        type: boolean
      run_migrations:
        description: Guard only; generic deploys never run migrations
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Reject database migration request
        if: inputs.run_migrations
        run: |
          echo 'Database migrations require a separate reviewed maintenance task.' >&2
          exit 30

      - uses: actions/setup-java@v4
        if: inputs.component == 'replacement-backend' || inputs.component == 'all'
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build replacement backend
        if: inputs.component == 'replacement-backend' || inputs.component == 'all'
        working-directory: backend/starfree-replacement
        run: |
          mvn -q test
          mvn -q package -DskipTests

      - name: Validate PHP admin
        if: inputs.component == 'admin' || inputs.component == 'all'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli
          find admin/starfree-admin -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate legacy API checksum
        if: inputs.component == 'legacy-api' || inputs.component == 'all'
        run: sha256sum -c backend/legacy-api/SHA256SUMS

      - name: Prepare release archive
        id: release
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          mkdir -p release
          printf 'COMPONENT=%s\nCOMMIT=%s\n' '${{ inputs.component }}' "$commit" > release/manifest.env
          if [[ '${{ inputs.component }}' == replacement-backend || '${{ inputs.component }}' == all ]]; then
            cp backend/starfree-replacement/target/starfree-replacement-*.jar release/replacement-backend.jar
          fi
          if [[ '${{ inputs.component }}' == legacy-api || '${{ inputs.component }}' == all ]]; then
            cp backend/legacy-api/dist/StarFreeApi.jar release/legacy-api.jar
          fi
          if [[ '${{ inputs.component }}' == admin || '${{ inputs.component }}' == all ]]; then
            tar -czf release/admin.tar.gz -C admin starfree-admin
          fi
          tar -czf release.tgz -C release .
          sha256sum release.tgz | tee release.tgz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.release.outputs.commit }}
          path: |
            release.tgz
            release.tgz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Dry-run summary
        if: inputs.dry_run
        run: |
          echo 'dry_run=true'
          echo 'No server connection was made.'

  deploy:
    if: ${{ !inputs.dry_run }}
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Enforce exact main commit
        env:
          RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
        run: test "$RELEASE_COMMIT" = "$(git rev-parse HEAD)"

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.release_commit }}

      - name: Verify release checksum
        run: sha256sum -c release.tgz.sha256

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' '${{ secrets.LCXQY_SSH_PRIVATE_KEY }}' > ~/.ssh/lcxqy_deploy
          chmod 600 ~/.ssh/lcxqy_deploy
          printf '%s\n' '${{ secrets.LCXQY_SSH_KNOWN_HOSTS }}' > ~/.ssh/known_hosts

      - name: Server preflight
        shell: bash
        env:
          SSH_HOST: ${{ secrets.LCXQY_SSH_HOST }}
          SSH_USER: ${{ secrets.LCXQY_SSH_USER }}
        run: |
          set -euo pipefail
          checks='set -e; test -x /usr/local/sbin/lcxqy-deploy; test -x /usr/local/sbin/lcxqy-rollback; sudo -n /usr/local/sbin/lcxqy-deploy --help >/dev/null'
          if [[ '${{ inputs.component }}' == replacement-backend || '${{ inputs.component }}' == all ]]; then
            checks="$checks; systemctl cat starfree-replacement.service >/dev/null"
          fi
          if [[ '${{ inputs.component }}' == legacy-api || '${{ inputs.component }}' == all ]]; then
            checks="$checks; systemctl cat starfree-legacy.service >/dev/null"
          fi
          ssh -i ~/.ssh/lcxqy_deploy -o BatchMode=yes "$SSH_USER@$SSH_HOST" "$checks"

      - name: Upload and deploy
        shell: bash
        env:
          SSH_HOST: ${{ secrets.LCXQY_SSH_HOST }}
          SSH_USER: ${{ secrets.LCXQY_SSH_USER }}
          RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
        run: |
          set -euo pipefail
          hash=$(awk '{print $1}' release.tgz.sha256)
          remote="/tmp/lcxqy-release-$RELEASE_COMMIT.tgz"
          scp -i ~/.ssh/lcxqy_deploy -o BatchMode=yes release.tgz "$SSH_USER@$SSH_HOST:$remote"
          ssh -i ~/.ssh/lcxqy_deploy -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "sudo /usr/local/sbin/lcxqy-deploy --archive $remote --expected-sha256 $hash"
          ssh -i ~/.ssh/lcxqy_deploy -o BatchMode=yes "$SSH_USER@$SSH_HOST" "rm -f $remote"
