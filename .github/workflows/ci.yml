name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Test replacement backend
        working-directory: backend/starfree-replacement
        run: mvn -q test

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli

      - name: Lint PHP admin
        run: find admin/starfree-admin -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check scripts
        shell: pwsh
        run: ./workflow.ps1 check scripts

      - name: Check docs and repository hygiene
        shell: pwsh
        run: ./workflow.ps1 check docs

      - name: Check complete pull request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
